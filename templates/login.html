{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl mt-12">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl mb-6">ورود به پنل</h2>

            <form method="POST">
                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">نام کاربری</span>
                    </label>
                    <input type="text" name="username" class="input input-bordered w-full" required />
                </div>

                <div class="form-control w-full mb-6">
                    <label class="label">
                        <span class="label-text">رمز عبور</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered w-full" required />
                </div>

                <button type="submit" class="btn btn-primary w-full">ورود</button>

                <div class="text-center mt-4">
                    <a href="{{ url_for('register') }}" class="link link-hover text-sm">حساب ندارید؟ ثبت نام با کد دعوت</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
