{% extends "base.html" %}
{% block title %}کد تایید تلگرام{% endblock %}
{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="shield-check" class="w-7 h-7 text-primary"></i>
            </div>
            <h1 class="text-xl font-bold">کد تایید تلگرام</h1>
            <p class="text-xs opacity-50 mt-1">کد ارسال شده به <span dir="ltr">{{ phone }}</span> را وارد کنید</p>
        </div>

        <div class="glass-card rounded-2xl p-6">
            <form method="POST" action="{{ url_for('verify_code') }}" class="space-y-4">
                <div class="form-control">
                    <label class="label pb-1"><span class="label-text text-xs font-medium opacity-60">کد تایید</span></label>
                    <input type="text" name="code" class="input input-bordered w-full bg-base-200/50 text-center" placeholder="12345" dir="ltr" required>
                </div>
                <button type="submit" class="btn btn-primary w-full gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    تایید
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
