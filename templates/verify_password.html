<!-- verify_code.html -->
{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center mb-4">2FA</h3>
            <p class="text-center text-muted">رمز اکانت را وارد کنید</p>
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control text-center" placeholder="12345" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">تایید</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
