{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center mb-4">رمز دوم تلگرام</h3>
            <p class="text-center text-muted">رمز دوم اکانت {{ phone }} را وارد کنید</p>

            <form method="POST" action="{{ url_for('verify_password') }}">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control text-center" placeholder="Cloud Password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">تایید</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
