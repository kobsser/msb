{% extends "base.html" %}
{% block title %}رمز دوم تلگرام{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl mt-12">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl mb-2">رمز دوم تلگرام</h2>
            <p class="text-center text-base-content/70 mb-4">رمز دوم اکانت <span dir="ltr">{{ phone }}</span> را وارد کنید</p>

            <form method="POST" action="{{ url_for('verify_password') }}">
                <input type="password" name="password" class="input input-bordered w-full text-center mb-4" placeholder="Cloud Password" required />
                <button type="submit" class="btn btn-primary w-full">تایید</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
