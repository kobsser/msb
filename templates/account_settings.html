{% extends "base.html" %}
{% block content %}
<div class="card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>تنظیمات {{ acc.phone }}</h4>
        <form action="{{ url_for('refresh_groups', phone=acc.phone) }}" method="POST" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-secondary">🔄 بروزرسانی گروه‌ها</button>
        </form>
    </div>
    
    <form action="{{ url_for('save_account_settings', phone=acc.phone) }}" method="POST">
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" name="meow_enabled" id="meow" {% if acc.meow_enabled %}checked{% endif %}>
            <label class="form-check-label fw-bold" for="meow">فعالسازی میو (Meow)</label>
        </div>
        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" name="pishi_enabled" id="pishi" {% if acc.pishi_enabled %}checked{% endif %}>
            <label class="form-check-label fw-bold" for="pishi">فعالسازی پیشی (Pishi)</label>
        </div>
        
        <hr>
        <h5 class="mb-3">گروه‌های هدف</h5>
        <div class="mb-4" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">
            {% for group in acc.cached_groups %}
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="groups" value="{{ group.id }}" id="g_{{ group.id }}" 
                       {% if group.id|string in acc.selected_groups %}checked{% endif %}>
                <label class="form-check-label" for="g_{{ group.id }}">
                    {{ group.title }} <span class="badge bg-secondary">{{ group.members }}👤</span>
                </label>
            </div>
            {% else %}
            <p class="text-danger text-center mb-0">هیچ گروهی پیدا نشد. ابتدا روی "بروزرسانی گروه‌ها" کلیک کنید.</p>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">ذخیره تنظیمات</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-light w-100">بازگشت</a>
    </form>
</div>
{% endblock %}
