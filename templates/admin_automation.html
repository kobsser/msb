{% extends "base.html" %}
{% block title %}Automation{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-base-content/5">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="sliders-horizontal" class="w-5 h-5 text-primary"></i>
                Global Automation
            </h2>
            <p class="text-xs opacity-50 mt-1">کنترل سراسری فیچرها جدا از تنظیمات هر اکانت</p>
        </div>

        <form method="POST" class="p-6">
            <div class="space-y-3">
                {% for key, label in items %}
                <label class="cursor-pointer flex items-center justify-between p-3 rounded-xl bg-base-200/50 hover:bg-base-200 transition-colors">
                    <span class="text-sm font-medium">{{ label }}</span>
                    <input type="checkbox" name="{{ key }}" class="toggle toggle-primary toggle-sm"
                        {% if states.get(key) %}checked{% endif %}>
                </label>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary w-full mt-6 gap-2">
                <i data-lucide="save" class="w-4 h-4"></i>
                ذخیره تنظیمات
            </button>
        </form>
    </div>
</div>
{% endblock %}
