{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center mb-4">افزودن اکانت تلگرام</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">شماره تلفن (با کد کشور)</label>
                    <input type="text" name="phone" class="form-control" placeholder="+989123456789" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">دریافت کد تایید</button>
                <div class="text-center mt-3">
                    <a href="{{ url_for('dashboard') }}">بازگشت</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
