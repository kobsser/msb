{% extends "base.html" %}
{% block title %}ثبت نام{% endblock %}
{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="user-plus" class="w-7 h-7 text-primary"></i>
            </div>
            <h1 class="text-xl font-bold">ثبت نام</h1>
            <p class="text-xs opacity-50 mt-1">ساخت حساب با کد دعوت</p>
        </div>

        <div class="glass-card rounded-2xl p-6">
            <form method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label pb-1"><span class="label-text text-xs font-medium opacity-60">کد دعوت</span></label>
                    <input type="text" name="invite_code" class="input input-bordered w-full bg-base-200/50" value="{{ request.args.get('code', '') }}" required>
                </div>
                <div class="form-control">
                    <label class="label pb-1"><span class="label-text text-xs font-medium opacity-60">نام کاربری دلخواه</span></label>
                    <input type="text" name="username" class="input input-bordered w-full bg-base-200/50" required>
                </div>
                <div class="form-control">
                    <label class="label pb-1"><span class="label-text text-xs font-medium opacity-60">رمز عبور</span></label>
                    <input type="password" name="password" class="input input-bordered w-full bg-base-200/50" required>
                </div>
                <button type="submit" class="btn btn-primary w-full gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    ثبت نام
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-xs text-primary hover:underline">قبلا ثبت نام کرده‌اید؟ ورود</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
