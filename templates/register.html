{% extends "base.html" %}
{% block title %}ثبت نام{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl mt-12">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl mb-6">ثبت نام</h2>

            <form method="POST">
                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">کد دعوت</span>
                    </label>
                    <input type="text" name="invite_code" class="input input-bordered w-full" value="{{ request.args.get('code', '') }}" required />
                </div>

                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">نام کاربری دلخواه</span>
                    </label>
                    <input type="text" name="username" class="input input-bordered w-full" required />
                </div>

                <div class="form-control w-full mb-6">
                    <label class="label">
                        <span class="label-text">رمز عبور</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered w-full" required />
                </div>

                <button type="submit" class="btn btn-success w-full">ثبت نام</button>

                <div class="text-center mt-4">
                    <a href="{{ url_for('login') }}" class="link link-hover text-sm">قبلا ثبت نام کرده‌اید؟ ورود</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
