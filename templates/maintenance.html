<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>body { font-family: 'Vazirmatn', Tahoma, sans-serif; }</style>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
    <div class="text-center">
        <div class="w-16 h-16 rounded-2xl bg-warning/10 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="wrench" class="w-8 h-8 text-warning"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2">🛠️ Maintenance</h1>
        <p class="text-sm opacity-50 leading-relaxed">
            سیستم در حال نگهداری است.
            <br>لطفا بعدا دوباره تلاش کنید.
        </p>
        <a href="/login" class="btn btn-outline btn-sm mt-6 gap-1">
            <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
            صفحه ورود
        </a>
    </div>
    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
