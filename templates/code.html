{% extends "base.html" %}
{% block title %}کد تایید{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl mt-12">
        <div class="card-body">
            <h1 class="card-title justify-center text-2xl mb-2">کد تایید</h1>
            <p class="text-center text-base-content/70 mb-6">
                کد ارسال شده به <span class="font-bold" dir="ltr">{{ phone }}</span> را وارد کنید
            </p>
            <form method="POST" action="{{ url_for('verify_code') }}">
                <input type="text" name="code" placeholder="کد ۵ رقمی" required autofocus
                       class="input input-bordered w-full mb-4 text-center text-xl tracking-widest"
                       dir="ltr" />
                <button type="submit" class="btn btn-success w-full">
                    تایید کد
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
