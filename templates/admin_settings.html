{% extends "base.html" %}
{% block content %}
<div class="card p-4">
    <h4 class="mb-4">Admin Settings</h4>

    <form method="POST">
        {% for item in editable_settings %}
        <div class="mb-3">
            <label class="form-label">{{ item.label }}</label>
            <input
                type="text"
                name="{{ item.key }}"
                class="form-control"
                value="{{ settings.get(item.key, '') }}"
            >
            <div class="form-text">Key: {{ item.key }}</div>
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100">Save Settings</button>
    </form>
</div>
{% endblock %}
