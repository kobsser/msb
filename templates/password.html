{% extends "base.html" %}
{% block title %}رمز دو مرحله‌ای{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="card w-full max-w-md bg-base-100 shadow-xl mt-12">
        <div class="card-body">
            <h1 class="card-title justify-center text-2xl mb-2">رمز دو مرحله‌ای</h1>
            <p class="text-center text-base-content/70 mb-6">اکانت دارای رمز دو مرحله‌ای است</p>
            <form method="POST" action="{{ url_for('verify_password') }}">
                <input type="password" name="password" placeholder="رمز دو مرحله‌ای" required autofocus
                       class="input input-bordered w-full mb-4" />
                <button type="submit" class="btn btn-success w-full">
                    تایید رمز
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
